name: Archive Claude Desktop Versions

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version to archive (optional)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-new-version:
    name: Check for new Desktop version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manual.outputs.version || steps.check.outputs.version }}
      needs-archive: ${{ steps.manual.outputs.needs-archive || steps.check.outputs.needs-archive }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for new version
        id: check
        if: github.event.inputs.version == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/desktop/check-version.js || true
        continue-on-error: true

      - name: Set manual version
        id: manual
        if: github.event.inputs.version != ''
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "needs-archive=true" >> $GITHUB_OUTPUT

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: check-new-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  download-and-verify:
    name: Download and verify Desktop installers
    runs-on: ubuntu-latest
    needs: [check-new-version, test]
    if: needs.check-new-version.outputs.needs-archive == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download installers
        run: |
          node scripts/desktop/download-installers.js ${{ needs.check-new-version.outputs.version }}

      - name: Verify checksums
        run: |
          node scripts/desktop/verify-checksums.js ${{ needs.check-new-version.outputs.version }}

      - name: Upload downloads as artifact
        uses: actions/upload-artifact@v6
        with:
          name: claude-desktop-${{ needs.check-new-version.outputs.version }}
          path: downloads/desktop-${{ needs.check-new-version.outputs.version }}
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-new-version, download-and-verify]
    if: needs.check-new-version.outputs.needs-archive == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: claude-desktop-${{ needs.check-new-version.outputs.version }}
          path: downloads/desktop-${{ needs.check-new-version.outputs.version }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/desktop/create-release.js ${{ needs.check-new-version.outputs.version }}

      - name: Update README with latest version
        run: |
          git pull --rebase origin main
          node scripts/update-readme-version.js desktop ${{ needs.check-new-version.outputs.version }}
          git config user.name "ProjectAILeap"
          git config user.email "projectaileap@gmail.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update Desktop latest version to v${{ needs.check-new-version.outputs.version }} [skip ci]"
          git push origin main

  notify-completion:
    name: Notify completion
    runs-on: ubuntu-latest
    needs: [check-new-version, create-release]
    if: always() && needs.check-new-version.outputs.needs-archive == 'true'
    steps:
      - name: Summary
        run: |
          echo "✅ Claude Desktop v${{ needs.check-new-version.outputs.version }} has been archived"
          echo "🔗 Check releases: ${{ github.server_url }}/${{ github.repository }}/releases"
